name: Validate deployed service and Android flows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: backend
      - name: Test the deployed API with disposable accounts
        run: npm test
        working-directory: backend
        env:
          API_TEST_URL: https://whatsapp-clone-api.arthur-j-regiani.workers.dev
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the real Android UI against HTTPS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w br.edu.ifsp.dmo.whatsapp.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            test "$(grep -c 'OK (1 test)' instrumentation.txt)" = 1
            mkdir -p android-evidence
            adb pull /sdcard/Android/data/br.edu.ifsp.dmo.whatsapp/files/evidence android-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-android-validation
          path: |
            instrumentation.txt
            android-evidence/
